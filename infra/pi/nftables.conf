#!/usr/sbin/nft -f
#
# Filtrage du nœud sentinelle sidgate.
#
# Politique : tout est refusé par défaut, dans les deux sens de traversée. Seuls
# trois flux entrants existent, et aucun ne concerne l'accès distant lui-même —
# celui-ci passe entièrement par le tunnel WireGuard.
#
# Installation :
#   sudo cp nftables.conf /etc/nftables.conf
#   sudo systemctl enable --now nftables
#
# Adapter LAN_IFACE, WG_IFACE et ADMIN_NET avant la première application.

define LAN_IFACE = "eth0"
define WG_IFACE  = "wg0"
# Réseau depuis lequel l'administration SSH est tolérée. Le restreindre est ce
# qui distingue un durcissement d'une décoration.
define ADMIN_NET = 192.168.1.0/24

flush ruleset

table inet sidgate {
	chain entrant {
		type filter hook input priority filter; policy drop;

		# Ne jamais casser la boucle locale : les conteneurs s'en servent.
		iif lo accept

		# Le suivi de connexion évite d'ouvrir des ports pour les réponses.
		ct state established,related accept
		ct state invalid drop

		# Diagnostic réseau. ICMP reste indispensable à la découverte de MTU ;
		# le bloquer produit des pannes difficiles à comprendre.
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

		# WireGuard. Seul port réellement exposé sur l'Internet public, et il
		# rejette silencieusement tout paquet non signé : un scan ne le voit pas.
		udp dport 51820 accept

		# Coordination du maillage, via Caddy. Nécessaire au premier
		# enrôlement d'un appareil et au renouvellement du certificat.
		tcp dport { 80, 443 } accept
		udp dport 443 accept

		# Administration : uniquement depuis le réseau local, par clé.
		iifname $LAN_IFACE ip saddr $ADMIN_NET tcp dport 22 accept

		# Micro-service de réveil : strictement à l'intérieur du tunnel.
		iifname $WG_IFACE tcp dport 9797 accept

		# Signalisation locale, si elle est déportée sur le Pi plutôt
		# qu'embarquée dans l'agent.
		iifname $WG_IFACE tcp dport 8443 accept

		# Tout le reste tombe, sans réponse : un port fermé qui répond révèle
		# l'existence de la machine.
		counter comment "paquets refusés en entrée"
	}

	chain transfert {
		type filter hook forward priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop

		# Le tunnel atteint le réseau local — c'est ce qui permet au client
		# d'atteindre la station de travail.
		iifname $WG_IFACE oifname $LAN_IFACE accept
		# L'inverse est refusé : une machine compromise du réseau local ne doit
		# pas pouvoir remonter dans le tunnel.
		counter comment "traversée refusée"
	}

	chain sortant {
		type filter hook output priority filter; policy accept;
	}
}
