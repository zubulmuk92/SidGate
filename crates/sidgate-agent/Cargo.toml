[package]
name = "sidgate-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sidgate"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bytes = "1.12.1"
clap = { version = "4.5.61", features = ["derive"] }
data-encoding = "2.11.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "pkcs8"] }
futures-util = "0.3.34"
p256 = { version = "0.13.2", features = ["ecdsa"] }
parking_lot = "0.12.5"
rand = "0.9.5"
rcgen = "0.14.7"
rtc = "0.20.5"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sidgate-capture = { version = "0.1.0", path = "../sidgate-capture" }
sidgate-encode = { version = "0.1.0", path = "../sidgate-encode" }
sidgate-input = { version = "0.1.0", path = "../sidgate-input" }
sidgate-proto = { version = "0.1.0", path = "../sidgate-proto" }
thiserror = "2.0.20"
time = "0.3.44"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.0.7"
tower-http = { version = "0.7.1", features = ["fs", "set-header", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "0.20.5"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Services", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Environment"] }
