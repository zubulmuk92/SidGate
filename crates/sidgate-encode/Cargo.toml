[package]
name = "sidgate-encode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
thiserror = "2.0.20"
tracing = "0.1.44"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Media_KernelStreaming", "Win32_System_Ole"] }

[dev-dependencies]
sidgate-capture = { path = "../sidgate-capture" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
