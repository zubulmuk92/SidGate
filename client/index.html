<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<title>sidgate</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181e;
    --line: #232a33;
    --text: #e6eaef;
    --muted: #8b97a6;
    --accent: #4da3ff;
    --danger: #ff6b6b;
    --ok: #5ad18f;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* --- Écran d'accueil --- */
  #gate {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
    background: var(--bg);
  }
  #gate[hidden] { display: none; }
  .mark { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
  .mark span { color: var(--accent); }
  #status { color: var(--muted); min-height: 1.4em; max-width: 34ch; }
  #status.error { color: var(--danger); }
  #fingerprint {
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted); word-break: break-all; max-width: 34ch;
  }
  button {
    font: inherit; font-weight: 550; color: var(--text);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 18px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #04070c; border-color: var(--accent); }
  #code {
    font: 600 22px/1 ui-monospace, Menlo, monospace; letter-spacing: .18em;
    text-align: center; text-transform: uppercase;
    width: 11ch; padding: 12px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  }
  #pairing[hidden], #connect[hidden] { display: none; }
  #pairing { display: flex; flex-direction: column; gap: 12px; align-items: center; }

  /* --- Session --- */
  #stage { position: fixed; inset: 0; background: #000; display: none; }
  #stage.live { display: block; }
  video {
    width: 100%; height: 100%; object-fit: contain;
    background: #000; display: block; touch-action: none;
  }
  #cursor {
    position: absolute; width: 14px; height: 14px; margin: -1px 0 0 -1px;
    pointer-events: none; opacity: .9; display: none;
  }
  #cursor.on { display: block; }

  #hud {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(11,13,16,.92) 45%);
    transform: translateY(calc(100% - 34px)); transition: transform .22s ease;
  }
  #hud.open { transform: translateY(0); }
  #grip {
    align-self: center; width: 42px; height: 4px; border-radius: 2px;
    background: var(--muted); opacity: .6; margin-bottom: 6px;
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .row button { padding: 7px 11px; font-size: 13px; border-radius: 8px; }
  .row button.on { border-color: var(--accent); color: var(--accent); }
  #telemetry {
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
    font: 11px/1.4 ui-monospace, Menlo, monospace; color: var(--muted);
  }
  #telemetry b { color: var(--text); font-weight: 600; }
  #toast {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); z-index: 30;
    padding: 8px 14px; border-radius: 8px; font-size: 13px;
    background: var(--panel); border: 1px solid var(--line);
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="gate">
  <div class="mark">sid<span>gate</span></div>
  <p id="status">Initialisation…</p>

  <div id="connect" hidden>
    <button id="unlock" class="primary">Déverrouiller et connecter</button>
  </div>

  <div id="pairing" hidden>
    <p>Saisissez le code affiché sur la console de l'hôte.</p>
    <input id="code" maxlength="9" autocomplete="off" autocapitalize="characters"
           spellcheck="false" inputmode="text" placeholder="····-····">
    <button id="pair" class="primary">Appairer cet appareil</button>
  </div>

  <p id="fingerprint"></p>
</div>

<div id="stage">
  <video id="screen" autoplay playsinline muted></video>
  <svg id="cursor" viewBox="0 0 12 18" aria-hidden="true">
    <path d="M1 1l10 9.5H6.2l2.6 5.6-2.1 1-2.6-5.7L1 14.6z"
          fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/>
  </svg>
</div>

<div id="hud">
  <div id="grip"></div>
  <div class="row" id="shortcuts"></div>
  <div class="row">
    <button data-quality="low">Éco</button>
    <button data-quality="balanced" class="on">Équilibré</button>
    <button data-quality="high">Haute</button>
    <button data-quality="ultra">Ultra</button>
    <button id="mode">Trackpad</button>
    <button id="keyboard">Clavier</button>
    <button id="fullscreen">Plein écran</button>
    <button id="lock">Verrouiller</button>
  </div>
  <div id="telemetry"></div>
</div>

<input id="ime" style="position:fixed;opacity:0;pointer-events:none;left:-100px"
       autocomplete="off" autocapitalize="off" spellcheck="false">
<div id="toast"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
